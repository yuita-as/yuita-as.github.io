  <section class="page-head">

      <p class="crumbs"><a href="index.html">Home</a> / <a href="supervision.html">Supervision</a> / Competitions</p>
      <h1>Competition supervision</h1>
      <p class="lead">Bimbingan lomba — student teams and presenters recognized in national competitions and international conferences.</p>

<script src="supervision-extra.js"></script>
<script>
(function () {
  var e = window.svEsc, d = window.COMPETITIONS;
  document.getElementById('list').innerHTML = d.length ? d.map(function (x) {
    return '<div class="card award"><span class="icon">★</span><div><span class="kicker">' + e(x.date) + ' · ' + e(x.event) + '</span><h3>' + e(x.result) + ' — ' + e(x.title) + '</h3><p><b style="color:var(--text)">' + e(x.team) + '</b></p>' + (x.note ? '<p>' + e(x.note) + '</p>' : '') + (x.url ? '<a href="' + e(x.url) + '">Read the news ↗</a>' : '') + '</div></div>';
  }).join('') : window.svEmpty('Competition records will be listed here.');
})();
</script>
<script src="layout.js"></script>
</body>
