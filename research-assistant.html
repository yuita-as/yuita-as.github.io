<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Research Assistant | Yuita Arum Sari</title>
<meta name="description" content="Research assistant opportunities in the Vision-Language Systems research group, Universitas Brawijaya.">
  <section class="section" id="team">
    <div class="wrap">
      <div class="section-head"><div><h2>Research assistants &amp; their achievements</h2><p>Members of the team and the intellectual property, patents, and publications they have produced while doing research with the group.</p></div></div>
      <div class="ra-bar">
        <div class="ra-summary" id="ra-summary"></div>
        <div class="ra-views" id="ra-views" role="group" aria-label="Choose view">
          <button type="button" data-v="compact" aria-pressed="true">By person</button>
          <button type="button" data-v="table" aria-pressed="false">Table</button>
          <button type="button" data-v="cards" aria-pressed="false">Cards</button>
        </div>
      </div>
      <div class="ra-tools">
        <div class="ra-filter" id="ra-filter" role="group" aria-label="Filter by output type"></div>
        <input class="ra-search" id="ra-search" type="search" placeholder="Search name or title…" aria-label="Search name or title">
      </div>
      <div id="ra-out"></div>
    </div>
  </section>
</main>

<script>
/* =====================================================================
   CARA MENGISI DATA
   ---------------------------------------------------------------------
   1) MAHASISWA — satu baris per orang.
      [ "kode",  "Nama lengkap",  "Prodi",  "Topik",  "foto (boleh kosong)" ]
      - kode  : singkatan unik, dipakai di tabel KARYA (tanpa spasi)
      - foto  : mis. "img/ra/wahyu.jpg"; kosongkan "" untuk tampil inisial
      - NIM sengaja TIDAK dicantumkan (halaman ini publik)

   2) KARYA — satu baris per HKI / paten / publikasi / penghargaan.
      [ "jenis", "status", "tahun", "Judul", "kode mahasiswa (pisah spasi)", "venue/keterangan", "link", "dosen" ]
      - jenis : hki | paten | pub | award
      - status: mis. Copyright, Submitted, Filed, Granted, Accepted, Published, 1st Place
      - dosen : nama dosen yang terlibat, pisah dengan koma (boleh kosong)
      - kolom yang tidak ada isinya cukup ""
   ===================================================================== */

var MAHASISWA = [
//  kode        nama                                          prodi                  topik                     foto
  ["wahyu",    "Wahyu Dwi Laksana Putri",                    "Teknik Informatika",  "Smart Nutrition",        ""],
  ["alvian",   "Achmad Alvian Prasetio",                     "Teknik Informatika",  "Smart Nutrition",        ""],
  ["michael",  "Michael Aditya Patria Wijanarko",            "Teknik Komputer",     "Smart Nutrition",        ""],
  ["farel",    "Farel Paris Hutajulu",                       "Teknik Komputer",     "Smart Nutrition",        ""],
  ["andys",    "Andys Deni Satria",                          "Teknik Komputer",     "Smart Nutrition",        ""],
  ["nico",     "Nico Arya Divano",                           "",                    "Smart Nutrition",        ""],
  ["sulthon",  "Muhammad Sulthon Aulia Wijaya",              "",                    "Smart Nutrition",        ""],
  ["ghazy",    "Muhammad Ghazy Humaidi",                     "",                    "Smart Nutrition",        ""],
  ["zuhdi",    "Zuhdi Arif Azizi",                           "",                    "Smart Nutrition",        ""],
  ["hudzaifah","Hudzaifah",                                  "Teknik Informatika",  "",                       ""],
  ["dito",     "Mukhammad Dito Okviansyah Ramadhan Putra",   "Teknik Informatika",  "",                       ""]
];

var KARYA = [
//  jenis    status       tahun   judul                                                                                                   mahasiswa                              venue / keterangan                                                                          link  dosen
  ["paten", "Filed",     "",     "Kotak Gizi Cerdas Generasi 2: Sistem Pengukuran Berat Otomatis dan Analisis Sisa Makanan Berbasis Citra Digital", "andys michael farel alvian wahyu", "Patent application",                                                                        "",   ""],
  ["hki",   "Copyright", "",     "Aplikasi Kotak Gizi Cerdas: Aplikasi Desktop Akuisisi Citra",                                           "wahyu alvian",                        "",                                                                                          "",   "Yuita Arum Sari, Sigit Adinugroho, Yudi Arimba Wani"],
  ["hki",   "Copyright", "",     "MakanKita: Aplikasi Berbasis Citra untuk Identifikasi Makanan dan Rekomendasi Resep Rendah Kalori",     "nico sulthon ghazy zuhdi",            "",                                                                                          "",   "Yuita Arum Sari, Sigit Adinugroho, Yudi Arimba Wani"],
  ["hki",   "Copyright", "",     "NutriNusa: Sistem Cerdas Berbasis Web untuk Analisis Konsumsi dan Estimasi Asupan Gizi Makanan Menggunakan Pengolahan Citra Digital", "alvian wahyu", "",                                                                             "",   "Yuita Arum Sari, Sigit Adinugroho, Yudi Arimba Wani"],
  ["hki",   "Copyright", "",     "Program Firmware ESP32 untuk Mengukur Berat Makanan Kotak Gizi Cerdas Generasi 2",                      "michael farel andys wahyu alvian",    "",                                                                                          "",   "Wijaya Kurniawan (lead), Yuita Arum Sari, Sigit Adinugroho, Jaya Mahar Maligan, Yudi Arimba Wani"],
  ["hki",   "Copyright", "",     "Panduan Kotak Gizi Cerdas Generasi 2",                                                                  "michael farel andys wahyu alvian",    "",                                                                                          "",   "Yuita Arum Sari (lead), Wijaya Kurniawan, Sigit Adinugroho, Jaya Mahar Maligan, Yudi Arimba Wani"],
  ["hki",   "Submitted", "",     "Panduan Praktis Pembelajaran Digital Branding UMKM Melalui Pemanfaatan Teknologi Berbasis AI pada Pelaku Usaha Batik di Banyuwangi", "hudzaifah dito", "",                                                                             "",   ""],
  ["pub",   "Accepted",  "2027", "A Late-Fusion Multimodal Architecture for Indonesian Food Calorie Prediction Using Images and Ingredient Lists",     "wahyu alvian",                        "Conference · 2027 2nd International Conference on Advances in Artificial Intelligence and Machine Learning (AAIML 2027), Tokyo, Japan",  "",   "Yuita Arum Sari, Agus Wahyu Widodo"],
  ["pub",   "Accepted",  "2027", "Transformer-Based Late Fusion Using Images and Ingredients for Indonesian Food Calorie Prediction",     "wahyu alvian",                        "Conference · 2027 2nd International Conference on Advances in Artificial Intelligence and Machine Learning (AAIML 2027), Tokyo, Japan",  "",   "Yuita Arum Sari, Agus Wahyu Widodo"]
];

/* ===================== TAMPILAN — tidak perlu diedit ===================== */
(function () {
  var TYPES = { hki:["IP / HKI","IP / HKI"], paten:["Patent","Patents"], pub:["Publication","Publications"], award:["Award","Awards"] };
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function ini(n){ return n.split(/\s+/).filter(Boolean).map(function(w){return w[0];}).slice(0,2).join("").toUpperCase(); }

  var M = {}, people = MAHASISWA.map(function(r){
    var p = { id:r[0], name:r[1], prodi:r[2], topic:r[3], photo:r[4], outs:[] }; M[p.id] = p; return p; });
  var outs = KARYA.map(function(r){
    var o = { type:r[0], status:r[1], year:r[2], title:r[3], team:r[4].split(/\s+/).filter(Boolean), venue:r[5], url:r[6], lect:(r[7]||"").split(",").map(function(x){return x.trim();}).filter(Boolean) };
    o.team.forEach(function(id){ if (M[id]) M[id].outs.push(o); else console.warn("Kode anggota tidak dikenal:", id); });
    return o; });
  people.sort(function(a,b){ return b.outs.length-a.outs.length || a.name.localeCompare(b.name); });

  function av(p,size){ return p.photo ? '<img class="ra-av '+size+'" src="'+esc(p.photo)+'" alt="'+esc(p.name)+'" loading="lazy">'
                                      : '<span class="ra-av '+size+'" aria-hidden="true">'+esc(ini(p.name))+'</span>'; }
  function badge(t){ return '<span class="ra-badge b-'+t+'">'+TYPES[t][0]+'</span>'; }
  function stat(o){ return [o.status,o.year].filter(Boolean).map(esc).join(' · '); }
  function ttl(o){ return o.url ? '<a href="'+esc(o.url)+'">'+esc(o.title)+' ↗</a>' : esc(o.title); }
  function lect(o,cls){ return o.lect.length ? '<div class="'+cls+'">Lecturers: '+o.lect.map(esc).join(', ')+'</div>' : ''; }
  function sub(p){ return [p.prodi,p.topic].filter(Boolean).map(esc).join(' · '); }

  var counts = {}; outs.forEach(function(o){ counts[o.type]=(counts[o.type]||0)+1; });
  var present = Object.keys(TYPES).filter(function(t){ return counts[t]; });
  document.getElementById("ra-summary").innerHTML = '<span><b>'+people.length+'</b> research assistants</span>' +
    present.map(function(t){ return '<span><b>'+counts[t]+'</b> '+TYPES[t][counts[t]===1?0:1]+'</span>'; }).join("");

  var state = { view:"compact", type:"all", q:"" };
  var fEl = document.getElementById("ra-filter");
  fEl.innerHTML = ["all"].concat(present).map(function(t){
    return '<button type="button" data-f="'+t+'" aria-pressed="'+(t==="all")+'">'+(t==="all"?"All":TYPES[t][1])+'</button>'; }).join("");

  function okO(o){ return (state.type==="all"||o.type===state.type) &&
    (!state.q || (o.title+" "+o.venue+" "+o.team.map(function(id){return M[id]?M[id].name:"";}).join(" ")).toLowerCase().indexOf(state.q)>-1); }
  function okP(p){ return !state.q || p.name.toLowerCase().indexOf(state.q)>-1; }
  function pOuts(p){ return p.outs.filter(function(o){ return (state.type==="all"||o.type===state.type) &&
    (!state.q || okP(p) || o.title.toLowerCase().indexOf(state.q)>-1); }); }
  var EMPTY = '<div class="ra-empty">No matching results.</div>';

  var VIEWS = {
    compact: function(){
      var rows = people.map(function(p){
        var os = pOuts(p); if (!os.length && (state.type!=="all"||state.q)) return "";
        var c = {}; os.forEach(function(o){ c[o.type]=(c[o.type]||0)+1; });
        var chips = Object.keys(c).map(function(t){ return '<span class="ra-badge b-'+t+'">'+c[t]+' '+TYPES[t][c[t]===1?0:1]+'</span>'; }).join("");
        return '<details class="ra-row"><summary>'+av(p,"m")+
          '<div><div class="ra-name">'+esc(p.name)+'</div>'+(sub(p)?'<div class="ra-sub">'+sub(p)+'</div>':'')+'</div>'+
          '<div class="ra-counts">'+(chips||'<span class="ra-status">—</span>')+'</div><span class="ra-chev">›</span></summary>'+
          (os.length?'<ol>'+os.map(function(o){ return '<li>'+badge(o.type)+ttl(o)+(stat(o)?' <span class="ra-status">('+stat(o)+')</span>':'')+(o.venue?'<div class="ra-lect">'+esc(o.venue)+'</div>':'')+lect(o,'ra-lect')+'</li>'; }).join("")+'</ol>':'')+
          '</details>';
      }).join("");
      return rows ? '<div class="ra-compact">'+rows+'</div>' : EMPTY;
    },
    table: function(){
      var rows = outs.filter(okO).map(function(o,i){
        return '<tr><td>'+(i+1)+'</td><td>'+badge(o.type)+'</td>'+
          '<td><div class="t-title">'+ttl(o)+'</div>'+(o.venue?'<div class="t-venue">'+esc(o.venue)+'</div>':'')+'</td>'+
          '<td><div class="ra-people">'+o.team.filter(function(id){return M[id];}).map(function(id){ return '<span class="ra-person">'+av(M[id],"s")+esc(M[id].name)+'</span>'; }).join("")+'</div>'+lect(o,'ra-lect')+'</td>'+
          '<td class="ra-status">'+(stat(o)||'—')+'</td></tr>';
      }).join("");
      return rows ? '<div class="ra-tablewrap"><table class="ra-table"><thead><tr><th>#</th><th>Type</th><th>Title</th><th>Team</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table></div>' : EMPTY;
    },
    cards: function(){
      var cards = people.map(function(p){
        var os = pOuts(p); if (!os.length && (state.type!=="all"||state.q)) return "";
        return '<div class="card ra-card"><div class="ra-head">'+av(p,"l")+'<div><h3>'+esc(p.name)+'</h3>'+
          (sub(p)?'<div class="ra-sub">'+sub(p)+'</div>':'')+'<div class="ra-sub">'+p.outs.length+(p.outs.length===1?' output':' outputs')+'</div></div></div>'+
          (os.length?'<ul class="ra-list">'+os.map(function(o){ return '<li>'+badge(o.type)+'<div>'+ttl(o)+'</div>'+(stat(o)?'<div class="ra-status">'+stat(o)+'</div>':'')+(o.venue?'<div class="ra-lect">'+esc(o.venue)+'</div>':'')+lect(o,'ra-lect')+'</li>'; }).join("")+'</ul>'
                    :'<p class="small muted">Achievements will be added.</p>')+'</div>';
      }).join("");
      return cards ? '<div class="ra-grid">'+cards+'</div>' : EMPTY;
    }
  };

  function render(){ document.getElementById("ra-out").innerHTML = VIEWS[state.view](); }
  function group(el,attr,key){ el.addEventListener("click",function(e){ var b=e.target.closest("button"); if(!b) return;
    [].forEach.call(el.querySelectorAll("button"),function(x){ x.setAttribute("aria-pressed",x===b); });
    state[key]=b.getAttribute(attr); render(); }); }
  group(document.getElementById("ra-views"),"data-v","view");
  group(fEl,"data-f","type");
  document.getElementById("ra-search").addEventListener("input",function(e){ state.q=e.target.value.trim().toLowerCase(); render(); });
  render();
})();
</script>
<script src="layout.js"></script>

</body>
</html>
