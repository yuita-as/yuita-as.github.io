<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Article | Yuita Arum Sari</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="main">
  <section class="page-head">
    <div class="wrap">
      <p class="crumbs"><a href="index.html">Home</a> / <a href="blog.html">Blog</a></p>
      <span class="kicker" id="post-meta"></span>
      <h1 id="post-title"></h1>
      <p class="lead" id="post-summary"></p>
    </div>
  </section>
  <section class="section">
    <article class="wrap"><div class="card prose" id="post-content"></div></article>
  </section>
</main>
<script src="blog-data.js"></script>
<script>
(function () {
  var slug = new URLSearchParams(location.search).get('slug');
  var p = window.BLOG_POSTS.find(function (x) { return x.slug === slug; }) || window.BLOG_POSTS[0];
  document.title = p.title + ' | Yuita Arum Sari';
  document.getElementById('post-meta').textContent = p.date + ' · ' + p.tag;
  document.getElementById('post-title').textContent = p.title;
  document.getElementById('post-summary').textContent = p.summary;
  var box = document.getElementById('post-content');
  p.content.split('\n').filter(Boolean).forEach(function (t) { var el = document.createElement('p'); el.textContent = t; box.append(el); });
})();
</script>
<script src="layout.js"></script>
</body>
</html>
